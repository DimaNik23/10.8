<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список фильмов</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <form class="film-form" novalidate>
        <label>
            Название:
            <input type="text" name="title" class="title" required>
        </label>

        <label>
            Жанр:
            <input type="text" name="genre" class="genre" required>
        </label>

        <label>
            Год:
            <input type="number" name="year" class="year" required>
        </label>

        <label>
            <input type="checkbox" name="watched" class="watched">
            Успели посмотреть?
        </label>

        <p class="error"></p>

        <button type="submit" class="submit-button">Добавить</button>
        <button type="button" class="cancel-button" hidden>Отменить редактирование</button>
    </form>

    <select class="sort-select">
        <option value="title">Название</option>
        <option value="genre">Жанр</option>
        <option value="year">Год</option>
    </select>

    <button class="sort-button">Сортировать</button>

    <table class="film-table">
        <thead>
            <tr>
                <th>Название</th>
                <th>Жанр</th>
                <th>Год</th>
                <th>Успели посмотреть?</th>
                <th>Действие</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</body>
</html>
