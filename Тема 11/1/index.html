<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма опроса</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <h1>Форма опроса</h1>

    <form class="survey" novalidate>
        <p>
            <label>
                Имя пользователя:
                <input type="text" name="username" class="username" required>
            </label>
            <span class="nameError"></span>
        </p>

        <p>
            <label>
                Email:
                <input type="email" name="email" class="email" required>
            </label>
            <span class="emailError"></span>
        </p>

        <p>
            Пол:
            <label>
                <input type="radio" name="gender" value="Мужской">
                Мужской
            </label>
            <label>
                <input type="radio" name="gender" value="Женский">
                Женский
            </label>
        </p>

        <p>
            <label>
                Оценка сервиса:
                <input type="range" name="rating" min="1" max="10" value="5">
            </label>
        </p>

        <p>
            Интересы пользователя:<br>
            <label>
                <input type="checkbox" name="interest" value="Спорт">
                Спорт
            </label><br>
            <label>
                <input type="checkbox" name="interest" value="Музыка">
                Музыка
            </label><br>
            <label>
                <input type="checkbox" name="interest" value="Путешествия">
                Путешествия
            </label><br>
            <label>
                <input type="checkbox" name="interest" value="Кино">
                Кино
            </label>
        </p>

        <p>
            <label>
                Дополнительные комментарии:<br>
                <textarea name="comments" rows="4" cols="40"></textarea>
            </label>
        </p>

        <button type="submit">Отправить</button>
    </form>

    <div class="result"></div>
</body>
</html>
