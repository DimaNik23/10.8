<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости доставки</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <h1>Калькулятор стоимости доставки</h1>

    <form class="product-form" novalidate>
        <p>
            <label>
                Название товара:
                <input type="text" name="name" required>
            </label>
        </p>
        <p>
            <label>
                Вес товара (кг):
                <input type="number" name="weight" step="any" required>
            </label>
        </p>
        <p>
            <label>
                Расстояние доставки (км):
                <input type="number" name="distance" step="any" required>
            </label>
        </p>
        <button type="submit">Добавить товар</button>
    </form>

    <table class="product-table">
        <thead>
            <tr>
                <th>Название товара</th>
                <th>Вес (кг)</th>
                <th>Расстояние (км)</th>
                <th>Стоимость доставки</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</body>
</html>
